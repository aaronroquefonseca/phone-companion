name: Release

# Tag-triggered distribution. Push a tag like v0.1.0 and this workflow:
#   1. builds + pushes the backend image to a registry (default ghcr.io),
#   2. builds a versioned Android APK,
#   3. attaches the APK + SHA256SUMS.txt (machine-verifiable `sha256sum`
#      output over the APK) + image-digest.txt (backend image digest, kept
#      as its own file so SHA256SUMS.txt stays machine-verifiable) to a
#      GitHub Release for the tag.
#
# workflow_dispatch exists so the build jobs (the risky part: SDK setup,
# Gradle, docker build) are exercisable before release day. Manual runs
# only build + upload artifacts; the publish job runs on tag push only
# (creating a release for a branch name would be wrong), and a manual run
# of backend-image pushes a branch-named tag — harmless, and faithful.
#
# Auth: only GITHUB_TOKEN (image push + release creation). No secrets are
# committed anywhere; nothing in this workflow needs extra secrets for the
# default registry. To point at a different registry, set the REGISTRY
# repo variable — pushes there need that registry's credentials, which is
# intentionally left as an extension point (see comment on the login step).
#
# APK signing note: the app has no release keystore yet (never committed;
# see android/app/build.gradle), so the release artifact is the debug APK
# renamed with the tag. Release signing is future work, tracked alongside
# the remaining F-Droid steps in docs/fdroid.md.
#
# All third-party actions are pinned to full commit SHAs (tag in trailing
# comment) — this workflow holds write permissions, so floating tags are
# not acceptable here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: backend image (registry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: build + push backend image
        run: |
          echo 'Local repro (from repo root): docker build -t phone-companion-backend:local ./backend'
          IMAGE="$(echo "$REGISTRY/${{ github.repository }}-backend" | tr '[:upper:]' '[:lower:]')"
          TAG="${GITHUB_REF_NAME}"
          docker build -t "$IMAGE:$TAG" ./backend
          # Works as-is for the default ghcr.io (GITHUB_TOKEN). A custom
          # REGISTRY needs its own credentials wired in here instead.
          echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" > image-digest.txt
          cat image-digest.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-digest
          path: image-digest.txt

  android-apk:
    name: android APK (release attachment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Explicit package list: the action's defaults reference the obsolete
      # `tools` package (sdkmanager exit 1). compileSdk/targetSdk 34 pins
      # the platform + build-tools versions below.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: build APK
        run: |
          echo 'Local repro: cd android && ./gradlew assembleDebug   (needs JDK 17 + Android SDK)'
          ./gradlew assembleDebug --console=plain
          OUT="phone-companion-${GITHUB_REF_NAME}.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/$OUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          # workflow_dispatch names the APK after the branch; the publish
          # job (tag push only) is what ships versioned artifacts.
          path: phone-companion-*.apk

  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tag push only: a manual dispatch must never create a release named
    # after a branch.
    if: github.event_name == 'push'
    needs: [backend-image, android-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-image-digest

      - name: checksums + create release
        run: |
          ls -la
          # SHA256SUMS.txt holds ONLY sha256sum output lines so that
          # `sha256sum -c SHA256SUMS.txt` verifies as-is after download.
          # The backend image digest lives in its own attached file.
          sha256sum phone-companion-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat image-digest.txt
          # Idempotent: a re-run uploads into the existing release instead
          # of failing on `create`.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              phone-companion-*.apk SHA256SUMS.txt image-digest.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              phone-companion-*.apk SHA256SUMS.txt image-digest.txt \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
