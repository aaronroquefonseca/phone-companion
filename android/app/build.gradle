// Phone Companion app module (P0 BASE skeleton).
//
// Declares the full dependency surface later PRs build on — networking,
// storage, background poll, widgets, push, QR scan — but contains no logic:
// activities navigate, workers/senders are TODO stubs.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// Firebase sender config for runtime init (see notify/FirebaseInit).
// The operator's per-machine android/app/google-services.json (gitignored,
// never committed) is parsed here at build time when present and its four
// fields are baked into BuildConfig. When the file is absent (CI, fresh
// checkouts, F-Droid path) every field is a TODO-OPERATOR placeholder, the
// build stays green, and FirebaseInit fails closed at runtime with a
// distinct log line — no google-services Gradle plugin, which would
// hard-fail the build without the file.
def loadFcmConfig() {
    def missing = [
        senderId : 'TODO-OPERATOR',
        projectId: 'TODO-OPERATOR',
        appId    : 'TODO-OPERATOR',
        apiKey   : 'TODO-OPERATOR',
    ]
    try {
        def f = file('google-services.json')
        if (!f.exists()) return missing
        def json = new groovy.json.JsonSlurper().parse(f)
        // Note: the key is singular "client" in google-services.json.
        def clients = json.client as List
        if (clients == null || clients.isEmpty()) return missing
        def client = clients.find {
            it?.client_info?.android_client_info?.package_name == 'com.phonecompanion.app'
        } ?: clients[0]
        def senderId = json?.project_info?.project_number?.toString()
        def projectId = json?.project_info?.project_id?.toString()
        def appId = client?.client_info?.mobilesdk_app_id?.toString()
        def apiKey = (client?.api_key as List)?.findResult {
            it?.current_key?.toString()
        }
        if (!senderId || !projectId || !appId || !apiKey) return missing
        return [senderId: senderId, projectId: projectId, appId: appId, apiKey: apiKey]
    } catch (Exception ignored) {
        return missing
    }
}
def fcmConfig = loadFcmConfig()

android {
    namespace 'com.phonecompanion.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.phonecompanion.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-skeleton'

        // Runtime Firebase init inputs (see notify/FirebaseInit). Real
        // values only when the operator's local google-services.json was
        // present at build time; TODO-OPERATOR placeholders otherwise.
        buildConfigField 'String', 'FCM_SENDER_ID', "\"${fcmConfig.senderId}\""
        buildConfigField 'String', 'FCM_PROJECT_ID', "\"${fcmConfig.projectId}\""
        buildConfigField 'String', 'FCM_APP_ID', "\"${fcmConfig.appId}\""
        buildConfigField 'String', 'FCM_API_KEY', "\"${fcmConfig.apiKey}\""
    }

    buildTypes {
        debug {}
        release {
            // TODO (later PR): wire signing config; never commit keystores.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // --- UI / core ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // --- Networking (pairing enroll, widget poll, notify plumbing) ---
    // TODO (pairing/widgets PRs): base URL config + pinning policy.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- Local storage (device credentials, widget cache) ---
    // TODO (pairing PR): entities + encrypted store for secrets.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // --- Background poll: ~hourly, screen-on aware, no exact alarms ---
    // TODO (widgets PR): PeriodicWorkRequest + constraints.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'

    // --- Home-screen widgets (Glance) ---
    // TODO (widgets PR): one implementation per widget type (text/secret/
    // list/status) — shared polling plumbing, no fully-generic renderer.
    implementation 'androidx.glance:glance:1.1.1'
    implementation 'androidx.glance:glance-appwidget:1.1.1'

    // --- Push (FCM) ---
    // NOTE: google-services plugin intentionally NOT applied: no
    // google-services.json in the skeleton. The notifications PR wires
    // sender config + documents setup.
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-messaging'

    // --- QR pairing scan (ML Kit barcode) ---
    // GmsBarcodeScanner: ML Kit-backed scan activity, no camera boilerplate.
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // --- Encrypted credential storage (device_id + token + device_key) ---
    // 1.1.x is current; EncryptedSharedPreferences carries a deprecation
    // marker (no stable DataStore replacement shipped) but remains the
    // documented approach — suppressed locally, see SecureStorage.
    implementation 'androidx.security:security-crypto:1.1.0'

    // --- Coroutines (lifecycleScope elsewhere is transitive; explicit here) ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'

    // --- Tests ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
